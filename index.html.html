<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary Master</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--tx:#2d3436}*{box-sizing:border-box}
body{margin:0;padding:10px;font-family:Nunito,sans-serif;color:var(--tx);background:#fffdf8}
h1{font-family:Poppins,sans-serif;text-align:center;margin:4px 0;font-size:1.7rem;background:linear-gradient(90deg,#3a9bd0,#e0638f,#d99a1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:.9rem}
select,input{font:inherit;padding:6px 8px;border:2px solid #A0E6FF;border-radius:10px;color:var(--tx)}
button{font-family:inherit;color:var(--tx);cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.tb{border:2px solid #A0E6FF;background:#fff;border-radius:18px;padding:8px 12px;font:700 .85rem Poppins,sans-serif;min-height:40px}
.tb.on{background:#A0E6FF}
#main{max-width:900px;margin:auto;background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 10px #0001;min-height:300px}
.bw{max-width:600px;margin:0 auto 12px}.bh{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:4px}
.bt{height:14px;background:#eee;border-radius:9px;overflow:hidden}.bf{height:100%;border-radius:9px;transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.fc{height:250px;border-radius:14px;cursor:pointer;position:relative;box-shadow:0 3px 8px #0002;overflow:hidden}
.front,.back{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column}
.front{align-items:center;justify-content:center}.back{display:none;overflow-y:auto;background:#fff;border:4px solid;border-radius:14px;text-align:left}
.fc.flip .front{display:none}.fc.flip .back{display:flex}
.cw{font:700 1.9rem Poppins,sans-serif}
.sp,.sp2{border:0;background:#fff;border-radius:50%;width:44px;height:44px;font-size:1.2rem;box-shadow:0 2px 4px #0002}
.front .sp{position:absolute;right:12px;bottom:12px}
.pos{background:#444;color:#fff;border-radius:5px;padding:1px 6px;font-size:.8rem;margin-right:5px}
.df{font-weight:700;font-size:1.15rem;color:#c0392b;border-bottom:1px solid #eee;padding-bottom:6px;margin-bottom:6px}
.se{background:#f7f7f7;border-radius:6px;padding:6px;font-size:.92rem;line-height:1.4}.sc{font-size:.85rem;color:#555;margin:3px 0}
.us{font-size:.82rem;color:#555;margin-top:auto}
.pg{display:flex;justify-content:center;gap:12px;align-items:center;margin-top:14px}
.qc{border:3px solid #FFE66D;border-radius:12px;padding:16px;margin:10px 0;text-align:center}
.qw{font:700 2.1rem Poppins,sans-serif;word-break:break-word}.qs{font-weight:700;font-size:1.35rem;line-height:1.6}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:4px solid;border-radius:12px;padding:12px;min-height:64px;font-size:1.05rem;font-weight:700}
.opt:nth-child(1){border-color:#FFB3C6}.opt:nth-child(2){border-color:#FFC9A0}.opt:nth-child(3){border-color:#9ED9A0}.opt:nth-child(4){border-color:#8FD3F4}
.opt.ok{background:#C1E1C1;border-color:#43a047!important}.opt.no{background:#FFD1DC;border-color:#e53935!important}
#fb{text-align:center;font-weight:700;font-size:1.2rem;min-height:30px;margin-top:12px}.g{color:#1b7a2e}.r{color:#c62828}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{height:84px;border-radius:10px;font-weight:700;font-size:1rem;border:3px solid transparent;padding:4px}
.mc.sel{border-color:#d99a1e;transform:scale(.95)}.mc.done{visibility:hidden}
.bxs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.bx{width:42px;height:48px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:700 1.6rem Poppins,sans-serif;box-shadow:0 2px 4px #0002}
.bx:not(.f){opacity:.75}.sin{font:700 1.8rem Poppins,sans-serif;text-align:center;width:85%;max-width:380px;letter-spacing:3px}
.go{border:2px solid #8BCFE5;background:#A0E6FF;border-radius:16px;padding:10px 26px;font-weight:700;font-size:1.1rem;margin-top:14px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rc{border-radius:14px;padding:14px;text-align:center;line-height:1.7}
.ring{width:96px;height:96px;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center}
.ri{width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font:700 1.2rem Poppins,sans-serif}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin:8px 0}th,td{border:1px solid #ddd;padding:5px;text-align:center}th{background:#FFF5BA}
.ov{position:fixed;inset:0;background:#fffdf8;display:none;align-items:center;justify-content:center;z-index:9}
.ov>div{background:#fff;padding:22px;border-radius:14px;box-shadow:0 3px 14px #0003;width:300px;display:flex;flex-direction:column;gap:10px}
@media(max-width:600px){.og,.rg{grid-template-columns:1fr}.mg{grid-template-columns:repeat(2,1fr)}.bx{width:34px;height:40px;font-size:1.3rem}}
</style></head><body>
<h1>Vocabulary Master</h1>
<div class="hd"><span>字母 <select id="ls"></select></span><span id="who"></span><button class="tb" style="min-height:30px;padding:3px 10px" onclick="relogin()">換人</button><span id="sy"></span></div>
<div class="tabs" id="tabs"></div><div id="main"></div>
<div class="ov" id="ov"><div><b style="font:700 1.2rem Poppins">請輸入你的資料</b>
<input id="lc" placeholder="班級（例如 801）"><input id="lt" placeholder="座號（例如 5）" inputmode="numeric"><input id="ln" placeholder="姓名">
<button class="go" onclick="login()">開始練習</button></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyun8WAI6ICJYml2WoKwvx2nVwFLSo7KhPeiNObTEzWOFOCNg7tsI3gg_J6njd2hQzw/exec';            // ← 貼上 Apps Script 網頁應用程式網址（結尾 /exec）
const LETTER='B';        // ← 這一頁預設的字母
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWYZ'.split('');
const TABS=[['study','📖 單字學習'],['choice','📝 單字選擇'],['cloze','✏️ 克漏字'],['match','🧩 配對遊戲'],['spell','⌨️ 拼字聽寫'],['report','📊 學習報告'],['teacher','🧑‍🏫 教師後台']];
const NM={choice:'單字選擇',cloze:'克漏字',match:'配對遊戲',spell:'拼字聽寫'};
const COL=['#FFD1DC','#FFDAC1','#FFF5BA','#C1E1C1','#A0E6FF','#E0BBE4'];
const DEMO=[
{id:'d1',w:'ability',p:'n.',d:'能力;能耐',s:'She has the ability to explain difficult ideas so that everyone can understand them.',sc:'她有能力把困難的想法解釋得讓每個人都聽得懂。',u:'have the ability to V',c:'natural ability'},
{id:'d2',w:'able',p:'adj.',d:'能,可,會,有能力的',s:'Our team will be able to finish the project if we keep working together.',sc:'如果我們持續合作，團隊就能完成這個專案。',u:'be able to V',c:'be able to cope'},
{id:'d3',w:'about',p:'prep.',d:'關於,對於',s:'The teacher asked us what we had learned about the history of Taiwan.',sc:'老師問我們學到了哪些關於台灣歷史的事。',u:'think about',c:'talk about'},
{id:'d4',w:'about',p:'adv.',d:'大約;幾乎',s:'It took about two hours to repair the bike that was broken yesterday.',sc:'修理昨天壞掉的腳踏車花了大約兩小時。',u:'about + 數字',c:'about to V'},
{id:'d5',w:'accept',p:'v.',d:'接受,領受;答應,同意',s:'He was happy to accept the invitation that his classmate had sent him.',sc:'他很高興接受同學寄給他的邀請。',u:'accept an offer',c:'accept advice'},
{id:'d6',w:'accident',p:'n.',d:'事故;災禍',s:'The road was closed for hours because an accident had happened near the bridge.',sc:'因為橋附近發生了事故，道路封閉了好幾個小時。',u:'by accident',c:'traffic accident'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let user,L=LETTER,W=[],S={},tab='study',page=0,last=null,timer=null,adminKey='';
function speak(t,r){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||0.7;speechSynthesis.speak(u)}
const key=()=>'vm:'+user.id+':'+L;
function save(){ls.set(key(),S)}
const defS=()=>{const o={};Object.keys(NM).forEach(m=>o[m]={m:[],q:[],cur:null});return o};
const pool=m=>W.filter(x=>m!=='cloze'||x.cz).map(x=>x.id);
const blank=x=>{if(!x.s)return null;const re=new RegExp('\\b'+x.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');return re.test(x.s)?x.s.replace(re,'_____'):null};

/* ---------- 登入 / 載入 ---------- */
function login(){const c=$('lc').value.trim(),t=$('lt').value.trim(),n=$('ln').value.trim();if(!c||!t||!n){alert('三個欄位都要填喔！');return}
 user={cls:c,seat:t,name:n,id:c+'-'+t+'-'+n};ls.set('vm:user',user);$('ov').style.display='none';init()}
function relogin(){$('ov').style.display='flex'}
async function loadWords(){let w=null;
 if(API&&navigator.onLine){try{const j=await(await fetch(API+'?action=words&letter='+L)).json();if(j.ok&&j.words.length){w=j.words;ls.set('vm:w:'+L,w)}}catch(e){}}
 if(!w)w=ls.get('vm:w:'+L,null);
 if(!w)w=DEMO;
 W=w.map(x=>({id:String(x.id),w:String(x.w),p:x.p||'',d:String(x.d),s:x.s||'',sc:x.sc||'',u:x.u||'',c:x.c||''}));W.forEach(x=>x.cz=blank(x))}
async function init(){$('who').textContent='👤 '+user.name;await loadWords();
 S=ls.get(key(),null)||defS();Object.keys(NM).forEach(m=>{S[m]=S[m]||{m:[],q:[],cur:null}});go(tab);sync()}
function go(t){tab=t;clearInterval(timer);speechSynthesis&&speechSynthesis.cancel();
 $('tabs').innerHTML=TABS.map(x=>`<button class="tb ${x[0]===t?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
 ({study:vStudy,choice:()=>vGame('choice'),cloze:()=>vGame('cloze'),spell:()=>vGame('spell'),match:vMatch,report:vReport,teacher:vTeacher})[t]()}

/* ---------- 離線紀錄與同步 ---------- */
function rec(m,w,ok){const q=ls.get('vmq',[]);q.push({u:user.id+'|'+Date.now()+Math.random().toString(36).slice(2,6),t:Date.now(),cls:user.cls,seat:user.seat,name:user.name,letter:L,mode:m,wid:w.id,word:w.w,ok:ok?1:0});ls.set('vmq',q);sync()}
let syncing=false;
async function sync(){const n=()=>ls.get('vmq',[]).length;
 const show=t=>{$('sy').textContent=t};
 if(!API){show('（未連線後台）');return}
 if(!navigator.onLine){show('📴 離線中，'+n()+' 筆待上傳');return}
 if(syncing||!n()){if(!n())show('☁️ 已同步');return}
 syncing=true;const batch=ls.get('vmq',[]).slice(0,200);
 try{const j=await(await fetch(API,{method:'POST',body:JSON.stringify({records:batch})})).json();
  if(j.ok){const sent=new Set(batch.map(x=>x.u));ls.set('vmq',ls.get('vmq',[]).filter(x=>!sent.has(x.u)))}}catch(e){}
 syncing=false;show(n()?'⏳ '+n()+' 筆待上傳':'☁️ 已同步');if(n()&&navigator.onLine&&!syncing)setTimeout(sync,5000)}
addEventListener('online',sync);addEventListener('offline',sync);setInterval(sync,30000);

/* ---------- 進度條 ---------- */
function bar(m){let t,mm,p,txt,c;
 if(m==='study'){const ms=Object.keys(NM);let a=0,b=0;ms.forEach(k=>{const pl=pool(k);b+=pl.length;a+=S[k].m.filter(i=>pl.includes(i)).length});p=b?Math.round(a/b*100):0;txt=p+'% (平均)';c='#A0E6FF'}
 else{const pl=pool(m);mm=S[m].m.filter(i=>pl.includes(i)).length;p=pl.length?Math.round(mm/pl.length*100):0;txt=mm+'/'+pl.length+' ('+p+'%)';c=m==='cloze'?'#9ED9A0':'#FFE66D'}
 return `<div class="bw"><div class="bh"><span>${m==='study'?'總體學習進度':NM[m]+'通關進度'}</span><span>${txt}</span></div><div class="bt"><div class="bf" style="width:${p}%;background:${c}"></div></div></div>`}

/* ---------- 單字學習 ---------- */
function vStudy(){$('main').innerHTML=bar('study')+'<input id="sq" style="width:100%;margin-bottom:10px" placeholder="🔍 搜尋英文或中文（搜尋時顯示全部結果）"><div style="text-align:center;background:#f4f4f4;border-radius:8px;padding:6px;margin-bottom:12px;font-size:.9rem">點卡片翻面，點 🔊 聽發音（不會翻面）</div><div class="grid" id="cards"></div><div class="pg" id="pg"></div>';
 $('sq').oninput=()=>{page=0;cards()};
 $('cards').onclick=e=>{const s=e.target.closest('.sp,.sp2');if(s){e.stopPropagation();speak(s.dataset.t);return}const c=e.target.closest('.fc');if(c)c.classList.toggle('flip')};cards()}
function cards(){const q=$('sq').value.trim().toLowerCase(),per=10;
 const list=q?W.filter(x=>x.w.toLowerCase().includes(q)||x.d.includes(q)):W,pages=Math.max(1,Math.ceil(list.length/per));
 if(page>=pages)page=pages-1;const items=q?list:list.slice(page*per,page*per+per);
 $('cards').innerHTML=items.length?items.map((x,i)=>{const k=W.indexOf(x),c=COL[k%6];
  return `<div class="fc" style="background:${c}"><div class="front"><div class="cw">${esc(x.w)}</div><button class="sp" data-t="${esc(x.w)}">🔊</button></div>
  <div class="back" style="border-color:${c}"><div class="df"><span class="pos">${esc(x.p)}</span>${esc(x.d)}</div>
  ${x.s?`<div class="se">${esc(x.s)} <button class="sp2" style="width:32px;height:32px;font-size:.9rem" data-t="${esc(x.s)}">🔊</button></div><div class="sc">${esc(x.sc)}</div>`:'<div class="sc">（尚無例句）</div>'}
  <div class="us">用法：${esc(x.u)||'—'}<br>搭配：${esc(x.c)||'—'}</div></div></div>`}).join(''):'<p style="text-align:center">查無單字</p>';
 $('pg').innerHTML=q?`共 ${list.length} 筆`:`<button class="tb" ${page<1?'disabled':''} onclick="page--;cards();scrollTo(0,0)">◀ 上一頁</button><b>${page+1} / ${pages}</b><button class="tb" ${page>=pages-1?'disabled':''} onclick="page++;cards();scrollTo(0,0)">下一頁 ▶</button>`}

/* ---------- 練習引擎（答錯停留，間隔 3 題再出現） ---------- */
function nextId(m){const s=S[m];if(s.cur!=null&&pool(m).includes(s.cur))return s.cur;
 s.q.forEach(x=>x.cd--);const i=s.q.findIndex(x=>x.cd<=0);let id=null;
 if(i>-1)id=s.q.splice(i,1)[0].id;
 else{const qi=s.q.map(x=>x.id),av=pool(m).filter(x=>!s.m.includes(x)&&!qi.includes(x)&&x!==last);
  if(av.length)id=av[Math.floor(Math.random()*av.length)];
  else if(s.q.length)id=s.q.shift().id;
  else{const a2=pool(m).filter(x=>!s.m.includes(x));id=a2.length?a2[0]:null}}
 s.cur=id;save();return id}
function ans(m,w,ok){const s=S[m];s.cur=null;last=w.id;
 s.q=s.q.filter(x=>x.id!==w.id);
 if(ok){if(!s.m.includes(w.id))s.m.push(w.id)}else s.q.push({id:w.id,cd:4});
 save();rec(m,w,ok);
 const f=$('fb');if(f){f.textContent=ok?'Correct!你答對了!':'Try again!再試一次!';f.className=ok?'g':'r'}
 speak(ok?'Correct!':'Try again!',0.9);
 const b=document.querySelector('.bw');if(b)b.outerHTML=bar(m)}
function vGame(m){$('main').innerHTML=(m==='choice'?'':bar(m))+'<div id="qa"></div><div id="fb"></div>';play(m)}
function play(m){if(tab!==m)return;$('fb').textContent='';const id=nextId(m),box=$('qa');
 if(id==null){box.innerHTML='<h3 style="text-align:center">'+(pool(m).length?'🎉 恭喜！這個模式已全數通關！':'這個字母還沒有可出題的內容（克漏字需要在試算表填「例句」）')+'</h3>';return}
 const w=W.find(x=>x.id===id);
 if(m==='choice'){speak(w.w);let ds=shuf(W.filter(x=>x.d!==w.d&&x.w!==w.w));ds=ds.filter(x=>x.p===w.p).concat(ds.filter(x=>x.p!==w.p));
  const seen=new Set([w.d]),o=[{t:w.p+' '+w.d,ok:1}];for(const x of ds){if(o.length>=4)break;if(!seen.has(x.d)){seen.add(x.d);o.push({t:x.p+' '+x.d,ok:0})}}
  mc(m,w,`<div class="qw">${esc(w.w)}</div><div>請選出正確的詞性與中文解釋</div><button class="sp" data-t="${esc(w.w)}" onclick="speak('${esc(w.w).replace(/'/g,"\\'")}')">🔊</button>`,o)}
 else if(m==='cloze'){let ds=shuf(W.filter(x=>x.cz&&x.w.toLowerCase()!==w.w.toLowerCase()));ds=ds.filter(x=>x.p===w.p).concat(ds.filter(x=>x.p!==w.p));
  const seen=new Set([w.w.toLowerCase()]),o=[{t:w.w,ok:1}];for(const x of ds){if(o.length>=4)break;if(!seen.has(x.w.toLowerCase())){seen.add(x.w.toLowerCase());o.push({t:x.w,ok:0})}}
  mc(m,w,`<div class="qs">${esc(w.cz)}</div><div>請選出填入空格的正確單字</div>`,o)}
 else spellQ(w)}
function mc(m,w,q,opts){$('qa').innerHTML='<div class="qc">'+q+'</div><div class="og"></div>';const g=document.querySelector('#qa .og');
 shuf(opts).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;b._ok=o.ok;
  b.onclick=()=>{[...g.children].forEach(x=>{x.disabled=true;if(x._ok)x.classList.add('ok')});if(!o.ok)b.classList.add('no');ans(m,w,!!o.ok);setTimeout(()=>play(m),o.ok?1500:2800)};g.appendChild(b)})}
function spellQ(w){speak(w.w);const word=w.w,n=word.length;
 const bx=[...word].map((c,i)=>{const show=i===0||!/[a-z]/i.test(c);return `<span class="bx${show?' f':''}" style="background:${COL[i%6]}">${show?esc(c):''}</span>`}).join('');
 $('qa').innerHTML=`<div class="qc"><button class="sp" onclick="speak('${word.replace(/'/g,"\\'")}')">🔊</button>
 <div class="qs" style="margin-top:10px">(${esc(w.p)}) ${esc(w.d)}</div><div class="bxs">${bx}</div><div><b>(${n})</b></div>
 <input id="si" class="sin" maxlength="${n}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><br><button class="go" id="sb">送出</button></div>`;
 const chk=()=>{const i=$('si');if(i.disabled)return;i.disabled=true;const ok=i.value.trim().toLowerCase()===word.toLowerCase();
  if(!ok){i.value=word;i.style.color='#c62828'}ans('spell',w,ok);setTimeout(()=>play('spell'),ok?1500:2800)};
 $('sb').onclick=chk;$('si').onkeydown=e=>{if(e.key==='Enter')chk()};setTimeout(()=>$('si')&&$('si').focus(),300)}

/* ---------- 配對遊戲 ---------- */
function vMatch(){$('main').innerHTML='<div style="text-align:center"><div style="font:700 1.5rem Poppins">⏱ <span id="mt">0</span> 秒</div><div id="mg" class="mg" style="margin-top:10px"></div></div>';round()}
function round(){clearInterval(timer);let sec=0,sel=null,done=0;$('mt').textContent=0;
 let ids=shuf(pool('match').filter(i=>!S.match.m.includes(i)));if(ids.length<4)ids=ids.concat(shuf(pool('match').filter(i=>S.match.m.includes(i))));ids=ids.slice(0,4);
 if(!ids.length){$('mg').outerHTML='<h3>目前沒有單字</h3>';return}
 const cs=shuf(ids.flatMap(id=>{const w=W.find(x=>x.id===id);return [{id,t:w.w,k:'w'},{id,t:w.p+' '+w.d,k:'d'}]}));
 $('mg').innerHTML='';
 cs.forEach((c,i)=>{const b=document.createElement('button');b.className='mc';b.style.background=COL[i%6];b.textContent=c.t;
  b.onclick=()=>{if(b.classList.contains('done'))return;
   if(!sel){sel={c,b};b.classList.add('sel');return}
   if(sel.b===b){b.classList.remove('sel');sel=null;return}
   const a=sel;sel=null;const w=W.find(x=>x.id===c.id);
   if(a.c.id===c.id&&a.c.k!==c.k){a.b.classList.replace('sel','done');b.classList.add('done');speak('Great',0.9);
    if(!S.match.m.includes(c.id)){S.match.m.push(c.id);save()}rec('match',w,1);
    if(++done===ids.length){clearInterval(timer);setTimeout(()=>{alert('完成！用了 '+sec+' 秒 🎉');if(tab==='match')round()},400)}}
   else{rec('match',W.find(x=>x.id===a.c.id),0);b.classList.add('sel');setTimeout(()=>{a.b.classList.remove('sel');b.classList.remove('sel')},500)}};
  $('mg').appendChild(b)});
 timer=setInterval(()=>{sec++;const t=$('mt');if(t)t.textContent=sec},1000)}

/* ---------- 學習報告 ---------- */
function vReport(){const bg=[4,3,0,2];let h='<h2 style="text-align:center;font-family:Poppins">個人化學習報告</h2><div class="rg">';
 Object.keys(NM).forEach((m,i)=>{const pl=pool(m),t=pl.length,mm=S[m].m.filter(x=>pl.includes(x)).length,p=t?Math.round(mm/t*100):0;
  h+=`<div class="rc" style="background:${COL[bg[i]]}"><b style="font-size:1.1rem">${NM[m]}</b><div class="ring" style="background:conic-gradient(#43a047 ${p}%,rgba(255,255,255,.85) 0)"><div class="ri">${p}%</div></div>
  <div>總單字量：<b>${t}</b></div><div class="g"><b>已掌握：${mm}</b></div><div class="r"><b>未掌握：${t-mm}</b></div></div>`});
 $('main').innerHTML=h+'</div>'}

/* ---------- 教師後台 ---------- */
async function vTeacher(){const box=$('main');
 if(!API){box.innerHTML='<p>尚未設定 API 網址，無法讀取後台資料。</p>';return}
 if(!adminKey)adminKey=prompt('請輸入教師密碼')||'';if(!adminKey){box.innerHTML='<p>需要教師密碼。</p>';return}
 box.innerHTML='<p>讀取中…</p>';let j;
 try{j=await(await fetch(API+'?action=admin&letter='+L+'&key='+encodeURIComponent(adminKey))).json()}catch(e){box.innerHTML='<p>讀取失敗（可能離線）。</p>';return}
 if(!j.ok){adminKey='';box.innerHTML='<p>'+esc(j.msg||'錯誤')+'</p>';return}
 const by={},wr={};
 j.records.forEach(r=>{const id=r.cls+'-'+r.seat+'-'+r.name,o=by[id]||(by[id]={n:r.cls+' 班 '+r.seat+' 號 '+r.name,a:0,c:0,t:0,m:{choice:new Set,cloze:new Set,match:new Set,spell:new Set}});
  o.a++;o.t=Math.max(o.t,r.t);if(r.ok){o.c++;o.m[r.mode]&&o.m[r.mode].add(r.wid)}else{const k=r.word+'|'+r.mode;wr[k]=(wr[k]||0)+1}});
 const T={};Object.keys(NM).forEach(m=>T[m]=pool(m).length);
 const rows=Object.values(by).sort((a,b)=>a.n.localeCompare(b.n,'zh')).map(o=>`<tr><td>${esc(o.n)}</td><td>${o.a}</td><td>${Math.round(o.c/o.a*100)}%</td>${Object.keys(NM).map(m=>`<td>${o.m[m].size}/${T[m]}</td>`).join('')}<td>${new Date(o.t).toLocaleString('zh-TW',{hour12:false})}</td></tr>`).join('');
 const top=Object.entries(wr).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([k,v])=>{const[w,m]=k.split('|');return `<tr><td>${esc(w)}</td><td>${NM[m]||m}</td><td>${v}</td></tr>`}).join('');
 box.innerHTML=`<h3>字母 ${L}：全班作業進度（已答對單字數／總數）</h3><div style="overflow-x:auto"><table><tr><th>學生</th><th>作答數</th><th>正確率</th>${Object.values(NM).map(n=>`<th>${n}</th>`).join('')}<th>最近練習</th></tr>${rows||'<tr><td colspan=8>尚無資料</td></tr>'}</table></div>
 <h3>常錯單字 Top 15</h3><table><tr><th>單字</th><th>模式</th><th>答錯次數</th></tr>${top||'<tr><td colspan=3>尚無資料</td></tr>'}</table>`}

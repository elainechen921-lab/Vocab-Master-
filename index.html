<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary Master</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--tx:#2d3436}*{box-sizing:border-box}
html{font-size:125%}
.fz{display:inline-flex;align-items:center;gap:4px}.fz button{border:2px solid #A0E6FF;background:#fff;border-radius:10px;padding:2px 10px;font:700 .9rem Nunito,sans-serif}.fz button.on{background:#A0E6FF}
body{margin:0;padding:10px;font-family:Nunito,sans-serif;color:var(--tx);background:#fffdf8}
h1{font-family:Poppins,sans-serif;text-align:center;margin:4px 0;font-size:1.7rem;background:linear-gradient(90deg,#3a9bd0,#e0638f,#d99a1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;font-size:.9rem}
select,input{font:inherit;padding:6px 8px;border:2px solid #A0E6FF;border-radius:10px;color:var(--tx)}
button{font-family:inherit;color:var(--tx);cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.tb{cursor:pointer;border:2px solid #A0E6FF;background:#fff;border-radius:18px;padding:8px 12px;font:700 .85rem Poppins,sans-serif;min-height:2.5rem}
.tb.on{background:#A0E6FF}
#main{max-width:900px;margin:auto;background:#fff;border-radius:14px;padding:14px;box-shadow:0 3px 10px #0001;min-height:300px}
.bw{max-width:600px;margin:0 auto 12px}.bh{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:4px}
.bt{height:14px;background:#eee;border-radius:9px;overflow:hidden}.bf{height:100%;border-radius:9px;transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(17rem,100%),1fr));gap:14px}
.fc{height:17rem;border-radius:14px;cursor:pointer;position:relative;box-shadow:0 3px 8px #0002;overflow:hidden}
.front,.back{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column}
.front{align-items:center;justify-content:center}.back{display:none;overflow-y:auto;background:#fff;border:4px solid;border-radius:14px;text-align:left}
.fc.flip .front{display:none}.fc.flip .back{display:flex}
.cw{font:700 1.9rem Poppins,sans-serif}
.sp,.sp2{border:0;background:#fff;border-radius:50%;width:2.75rem;height:2.75rem;font-size:1.2rem;box-shadow:0 2px 4px #0002}
.front .sp{position:absolute;right:12px;bottom:12px}
.pos{background:#444;color:#fff;border-radius:5px;padding:1px 6px;font-size:.8rem;margin-right:5px}
.df{font-weight:700;font-size:1.15rem;color:#c0392b;border-bottom:1px solid #eee;padding-bottom:6px;margin-bottom:6px}
.se{background:#f7f7f7;border-radius:6px;padding:6px;font-size:.92rem;line-height:1.4}.sc{font-size:.85rem;color:#555;margin:3px 0}
.us{font-size:.82rem;color:#555;margin-top:auto}
.pg{display:flex;justify-content:center;gap:12px;align-items:center;margin-top:14px}
.qc{border:3px solid #FFE66D;border-radius:12px;padding:16px;margin:10px 0;text-align:center}
.qw{font:700 2.1rem Poppins,sans-serif;word-break:break-word}.qs{font-weight:700;font-size:1.35rem;line-height:1.6}
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:4px solid;border-radius:12px;padding:12px;min-height:4rem;font-size:1.05rem;font-weight:700}
.opt:nth-child(1){border-color:#FFB3C6}.opt:nth-child(2){border-color:#FFC9A0}.opt:nth-child(3){border-color:#9ED9A0}.opt:nth-child(4){border-color:#8FD3F4}
.opt.ok{background:#C1E1C1;border-color:#43a047!important}.opt.no{background:#FFD1DC;border-color:#e53935!important}
#fb{text-align:center;font-weight:700;font-size:1.2rem;min-height:30px;margin-top:12px}.g{color:#1b7a2e}.r{color:#c62828}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{height:5.5rem;border-radius:10px;font-weight:700;font-size:1rem;border:3px solid transparent;padding:4px}
.mc.sel{border-color:#d99a1e;transform:scale(.95)}.mc.done{visibility:hidden}
.bxs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.bx{width:2.7rem;height:3.1rem;border-radius:9px;display:flex;align-items:center;justify-content:center;font:700 1.6rem Poppins,sans-serif;box-shadow:0 2px 4px #0002}
.tbar{height:12px;background:#eee;border-radius:8px;margin:8px auto;max-width:30rem;overflow:hidden}#tb{height:100%;width:100%;background:#4ECDC4;transition:width .2s linear}
.mres{margin:14px auto;max-width:30rem;padding:14px;border-radius:12px;font:700 1.3rem Poppins,sans-serif}.mres.ok{background:#e8f5e9;border:3px solid #66bb6a}.mres.no{background:#ffebee;border:3px solid #ef5350}.mres .go{margin-top:10px}.mres small{font-weight:400;font-size:.9rem}
.rv{margin-top:14px;padding:12px;border-radius:12px;background:#fffde7;border:2px dashed #FFE66D;text-align:center}.rs{font-size:1.15rem}.hl{background:#ffe082;border-radius:4px;padding:0 3px}.rv .sc{margin:6px 0 10px}
.mt{margin:10px 0 4px}.tg{font:700 1rem Poppins,sans-serif;padding:6px 14px;margin:0 4px;border:2px solid #90a4ae;border-radius:20px;background:#fff;cursor:pointer}.tg.act{background:#4ECDC4;border-color:#26a69a;color:#fff}
.sph{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}.sph .sp{white-space:nowrap;width:auto;height:auto;border-radius:999px;padding:8px 16px;font:700 1rem Poppins,sans-serif;background:#7c3aed;color:#fff;border:0}
.wc{width:4.6rem;border-radius:10px;box-shadow:0 2px 4px #0002;display:flex;flex-direction:column;align-items:center;padding:4px;border:3px solid transparent}.wc.on{border-color:#1976d2}.wc.bad{border-color:#c62828;background:#ffcdd2!important}
.wb{position:relative;width:100%;height:7.5rem;background:#fff;border-radius:6px;overflow:hidden;background-image:linear-gradient(#cfd8dc,#cfd8dc),linear-gradient(#cfd8dc,#cfd8dc),linear-gradient(#ef5350,#ef5350),linear-gradient(#cfd8dc,#cfd8dc);background-size:100% 2px;background-position:0 20%,0 40%,0 60%,0 80%;background-repeat:no-repeat}
.wc.ed{cursor:pointer}.wcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.bg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:700 2.6rem Poppins,sans-serif;pointer-events:none}.kbm .wcv{display:none}.kbm .ed .bg{display:flex}
.sl{font:700 1.5rem Poppins,sans-serif;min-height:2rem;line-height:2rem}.ph{font-size:.9rem;color:#607d8b;margin:4px 0}
.kbd{max-width:44rem;margin:8px auto}.kr{display:flex;justify-content:center;gap:5px;margin:5px 0}.kk{flex:1;max-width:3.4rem;font:700 1.2rem Poppins,sans-serif;padding:9px 0;border:2px solid #b0bec5;border-radius:9px;background:#fff;cursor:pointer}.kk:active{background:#FFE66D}.kk.wd{max-width:4.8rem}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}.go2{font:700 1rem Poppins,sans-serif;padding:10px 18px;border:2px solid #90a4ae;border-radius:999px;background:#fff;cursor:pointer}.go2:disabled{opacity:.5}.ans{margin:6px 0;color:#c62828;font-size:1.2rem}
@media(max-width:600px){.wc{width:3.6rem}.wb{height:6rem}.kk{padding:8px 0;font-size:1rem}}
.bx:not(.f){opacity:.75}.sin{font:700 1.8rem Poppins,sans-serif;text-align:center;width:85%;max-width:24rem;letter-spacing:3px}
.go{border:2px solid #8BCFE5;background:#A0E6FF;border-radius:16px;padding:10px 26px;font-weight:700;font-size:1.1rem;margin-top:14px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rc{border-radius:14px;padding:14px;text-align:center;line-height:1.7}
.ring{width:6rem;height:6rem;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center}
.ri{width:4.4rem;height:4.4rem;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font:700 1.2rem Poppins,sans-serif}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin:8px 0}th,td{border:1px solid #ddd;padding:5px;text-align:center}th{background:#FFF5BA}#stb{height:100%;transition:width .2s linear}.spt{text-align:center;font:700 1.2rem Poppins;margin-bottom:6px}.tc{margin:6px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tc button{border:1px solid #bbb;background:#fff;border-radius:14px;padding:4px 10px;cursor:pointer}.tc button.on{background:#FFE66D;border-color:#e0b800;font-weight:700}.tc input,.tc select{padding:5px;border:1px solid #bbb;border-radius:6px}.tr{cursor:pointer}.tr:hover,.tr.sel{background:#FFF9D6}.td{background:#E8F5FF;border-radius:8px;padding:8px;margin:6px 0;font-size:.9rem}
.ov{position:fixed;inset:0;background:#fffdf8;display:none;align-items:center;justify-content:center;z-index:9}
.ov>div{background:#fff;padding:22px;border-radius:14px;box-shadow:0 3px 14px #0003;width:min(19rem,90vw);display:flex;flex-direction:column;gap:10px}
.rb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:5.75rem;border-radius:14px;padding:10px;font:700 1.15rem Poppins,sans-serif;color:var(--tx);text-decoration:none;box-shadow:0 2px 6px #0002;text-align:center}.big small{font:400 .8rem Nunito,sans-serif}.bd{border-collapse:collapse}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5rem,1fr));gap:10px}.lb{display:flex;align-items:center;justify-content:center;height:4.5rem;border-radius:14px;font:700 1.6rem Poppins,sans-serif;color:var(--tx);text-decoration:none;box-shadow:0 2px 6px #0002}
@media(max-width:600px){.rb{grid-template-columns:1fr}.og,.rg{grid-template-columns:1fr}.mg{grid-template-columns:repeat(2,1fr)}.bx{width:2.3rem;height:2.8rem;font-size:1.3rem}}
</style></head><body>
<h1>Vocabulary Master</h1><div style="text-align:center;font-size:.7rem;color:#999;margin-top:-6px">版本 2026-11-11 a</div>
<div class="hd"><span>字母 <select id="ls"></select></span><span id="who"></span><span class="fz">字體 <button onclick="setFz(100)" data-z="100">小</button><button onclick="setFz(125)" data-z="125">中</button><button onclick="setFz(150)" data-z="150">大</button></span><button class="tb" style="min-height:30px;padding:3px 10px" onclick="relogin()">換人</button><a id="hm" class="tb" style="display:none;text-decoration:none;min-height:30px;padding:4px 10px;color:var(--tx)">🏠 字母選單</a><span id="sy"></span></div>
<div class="tabs" id="tabs"></div><div id="main"></div>
<div class="ov" id="ov"><div><b style="font:700 1.2rem Poppins">請輸入你的資料</b>
<input id="lc" placeholder="班級（例如 801）"><input id="lt" placeholder="座號（例如 5）" inputmode="numeric"><input id="ln" placeholder="姓名">
<button class="go" onclick="login()">開始練習</button></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyun8WAI6ICJYml2WoKwvx2nVwFLSo7KhPeiNObTEzWOFOCNg7tsI3gg_J6njd2hQzw/exec';            // ← 貼上 Apps Script 網頁應用程式網址（結尾 /exec）
const PARAM=new URLSearchParams(location.search).get('letter');  // 網址 ?letter=B 會指定字母（= 試算表工作表名稱）
const LETTER=(PARAM||'B').trim();                                 // 沒帶參數時預設 B
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWYZ'.split('');
const TABS=[['study','📖 單字學習'],['choice','📝 單字選擇'],['cloze','✏️ 克漏字'],['match','🧩 配對遊戲'],['spell','⌨️ 拼字聽寫'],['report','📊 學習報告'],['teacher','🧑‍🏫 教師後台']];
const NM={choice:'單字選擇',cloze:'克漏字',match:'配對遊戲',spell:'拼字聽寫'};
const COL=['#FFD1DC','#FFDAC1','#FFF5BA','#C1E1C1','#A0E6FF','#E0BBE4'];
const DEMO=[
{id:'d1',w:'ability',p:'n.',d:'能力;能耐',s:'She has the ability to explain difficult ideas so that everyone can understand them.',sc:'她有能力把困難的想法解釋得讓每個人都聽得懂。',u:'have the ability to V',c:'natural ability'},
{id:'d2',w:'able',p:'adj.',d:'能,可,會,有能力的',s:'Our team will be able to finish the project if we keep working together.',sc:'如果我們持續合作，團隊就能完成這個專案。',u:'be able to V',c:'be able to cope'},
{id:'d3',w:'about',p:'prep.',d:'關於,對於',s:'The teacher asked us what we had learned about the history of Taiwan.',sc:'老師問我們學到了哪些關於台灣歷史的事。',u:'think about',c:'talk about'},
{id:'d4',w:'about',p:'adv.',d:'大約;幾乎',s:'It took about two hours to repair the bike that was broken yesterday.',sc:'修理昨天壞掉的腳踏車花了大約兩小時。',u:'about + 數字',c:'about to V'},
{id:'d5',w:'accept',p:'v.',d:'接受,領受;答應,同意',s:'He was happy to accept the invitation that his classmate had sent him.',sc:'他很高興接受同學寄給他的邀請。',u:'accept an offer',c:'accept advice'},
{id:'d6',w:'accident',p:'n.',d:'事故;災禍',s:'The road was closed for hours because an accident had happened near the bridge.',sc:'因為橋附近發生了事故，道路封閉了好幾個小時。',u:'by accident',c:'traffic accident'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function setFz(z){document.documentElement.style.fontSize=z+'%';ls.set('vm:fz',z);document.querySelectorAll('.fz button').forEach(b=>b.classList.toggle('on',+b.dataset.z===z))}
setFz(ls.get('vm:fz',125));
let user,L=LETTER,W=[],S={},tab='study',page=0,last=null,timer=null,adminKey='';
function speak(t,r){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||0.7;speechSynthesis.speak(u)}
const key=()=>'vm:'+user.id+':all';
const ALL='ALL',isAll=()=>L===ALL;
const lt=id=>String(id).includes('~')?String(id).split('~')[0]:String(id).replace(/\d+$/,'');
function remapIds(){ // 舊編號（A50）→ 新編號（A~xxxx）
 const mp={};W.forEach(x=>{if(x.o&&x.o!==x.id)mp[x.o]=x.id});
 Object.keys(NM).forEach(m=>{const s=S[m],M=new Set();
  s.m.forEach(i=>M.add(mp[i]||i));s.m=[...M];
  s.q.forEach(q=>{if(mp[q.id])q.id=mp[q.id]});if(s.cur!=null&&mp[s.cur])s.cur=mp[s.cur]})}
function migrate(){ // 把舊版「每個字母一份」的進度合併進共用進度
 LETTERS.concat([L]).forEach(x=>{const k='vm:'+user.id+':'+x;if(k===key())return;const o=ls.get(k,null);if(!o)return;
  Object.keys(NM).forEach(m=>{if(!o[m])return;S[m]=S[m]||{m:[],q:[],cur:null};
   o[m].m.forEach(i=>{if(!S[m].m.includes(i))S[m].m.push(i)});(o[m].q||[]).forEach(q=>{if(!S[m].q.some(y=>y.id===q.id)&&!S[m].m.includes(q.id))S[m].q.push(q)})});
  try{localStorage.removeItem(k)}catch(e){}})}
function save(){ls.set(key(),S)}
const defS=()=>{const o={};Object.keys(NM).forEach(m=>o[m]={m:[],q:[],cur:null});return o};
const pool=m=>W.filter(x=>m!=='cloze'||x.cz).map(x=>x.id);
const blank=x=>{if(!x.s)return null;const re=new RegExp('(?<![A-Za-z])'+x.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])','gi');return re.test(x.s)?x.s.replace(re,'_____'):null};

/* ---------- 登入 / 載入 ---------- */
function login(){const c=$('lc').value.trim(),t=$('lt').value.trim(),n=$('ln').value.trim();if(!c||!t||!n){alert('三個欄位都要填喔！');return}
 user={cls:c,seat:t,name:n,id:c+'-'+t+'-'+n};ls.set('vm:user',user);$('ov').style.display='none';init()}
function relogin(){$('ov').style.display='flex'}
async function loadWords(){let w=null;
 if(API&&navigator.onLine){try{const j=await(await fetch(API+'?action=words&letter='+encodeURIComponent(L))).json();if(j.ok&&j.words.length){w=j.words;ls.set('vm:w:'+L,w)}}catch(e){}}
 if(!w)w=ls.get('vm:w:'+L,null);
 if(!w)w=DEMO;
 W=w.map(x=>({id:String(x.id),o:x.o?String(x.o):'',w:String(x.w),p:x.p||'',d:String(x.d),s:x.s||'',sc:x.sc||'',u:x.u||'',c:x.c||''}));W.forEach(x=>x.cz=blank(x))}
async function init(){$('who').textContent='👤 '+user.name+(isAll()?'　🎲 全字母隨機挑戰':'');if(!PARAM){home();return}$('hm').href=location.pathname;$('hm').style.display='inline-block';await loadWords();
 S=ls.get(key(),null)||defS();Object.keys(NM).forEach(m=>{S[m]=S[m]||{m:[],q:[],cur:null}});migrate();remapIds();save();go(tab);sync()}
function go(t){tab=t;clearInterval(timer);speechSynthesis&&speechSynthesis.cancel();
 $('tabs').innerHTML=TABS.map(x=>`<button class="tb ${x[0]===t?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
 ({study:vStudy,choice:()=>vGame('choice'),cloze:()=>vGame('cloze'),spell:()=>vGame('spell'),match:vMatch,report:vReport,teacher:vTeacher})[t]()}

/* ---------- 離線紀錄與同步 ---------- */
function rec(m,w,ok){const q=ls.get('vmq',[]);q.push({u:user.id+'|'+Date.now()+Math.random().toString(36).slice(2,6),t:Date.now(),cls:user.cls,seat:user.seat,name:user.name,letter:lt(w.id),mode:m,wid:w.id,word:w.w,ok:ok?1:0});ls.set('vmq',q);sync()}
let syncing=false;
async function sync(){const n=()=>ls.get('vmq',[]).length;
 const show=t=>{$('sy').textContent=t};
 if(!API){show('（未連線後台）');return}
 if(!navigator.onLine){show('📴 離線中，'+n()+' 筆待上傳');return}
 if(syncing||!n()){if(!n())show('☁️ 已同步');return}
 syncing=true;const batch=ls.get('vmq',[]).slice(0,200);
 try{const j=await(await fetch(API,{method:'POST',body:JSON.stringify({records:batch})})).json();
  if(j.ok){const sent=new Set(batch.map(x=>x.u));ls.set('vmq',ls.get('vmq',[]).filter(x=>!sent.has(x.u)))}}catch(e){}
 syncing=false;show(n()?'⏳ '+n()+' 筆待上傳':'☁️ 已同步');if(n()&&navigator.onLine&&!syncing)setTimeout(sync,5000)}
addEventListener('online',sync);addEventListener('offline',sync);setInterval(sync,30000);

/* ---------- 進度條 ---------- */
function bar(m){let t,mm,p,txt,c;
 if(m==='study'){const ms=Object.keys(NM);let a=0,b=0;ms.forEach(k=>{const pl=pool(k);b+=pl.length;a+=S[k].m.filter(i=>pl.includes(i)).length});p=b?Math.round(a/b*100):0;txt=p+'% (平均)';c='#A0E6FF'}
 else{const pl=pool(m);mm=S[m].m.filter(i=>pl.includes(i)).length;p=pl.length?Math.round(mm/pl.length*100):0;txt=mm+'/'+pl.length+' ('+p+'%)';c=m==='cloze'?'#9ED9A0':'#FFE66D'}
 return `<div class="bw"><div class="bh"><span>${m==='study'?'總體學習進度':NM[m]+'通關進度'}</span><span>${txt}</span></div><div class="bt"><div class="bf" style="width:${p}%;background:${c}"></div></div></div>`}

/* ---------- 單字學習 ---------- */
function vStudy(){$('main').innerHTML=bar('study')+'<input id="sq" style="width:100%;margin-bottom:10px" placeholder="🔍 搜尋英文或中文（搜尋時顯示全部結果）"><div style="text-align:center;background:#f4f4f4;border-radius:8px;padding:6px;margin-bottom:12px;font-size:.9rem">點卡片翻面，點 🔊 聽發音（不會翻面）</div><div class="grid" id="cards"></div><div class="pg" id="pg"></div>';
 $('sq').oninput=()=>{page=0;cards()};
 $('cards').onclick=e=>{const s=e.target.closest('.sp,.sp2');if(s){e.stopPropagation();speak(s.dataset.t);return}const c=e.target.closest('.fc');if(c)c.classList.toggle('flip')};cards()}
function cards(){const q=$('sq').value.trim().toLowerCase(),per=10;
 const list=q?W.filter(x=>x.w.toLowerCase().includes(q)||x.d.includes(q)):W,pages=Math.max(1,Math.ceil(list.length/per));

function nextId(m){const s=S[m],P=new Set(pool(m)),M=new Set(s.m);
 if(s.cur!=null&&P.has(s.cur)&&!M.has(s.cur))return s.cur;
 s.q.forEach(x=>{if(P.has(x.id))x.cd--});
 const i=s.q.findIndex(x=>P.has(x.id)&&x.cd<=0);let id=null;
 if(i>-1)id=s.q.splice(i,1)[0].id;
 else{const qi=new Set(s.q.map(x=>x.id)),av=[...P].filter(x=>!M.has(x)&&!qi.has(x)&&x!==last);
  if(av.length)id=av[Math.floor(Math.random()*av.length)];
  else{const k=s.q.findIndex(x=>P.has(x.id));
   if(k>-1)id=s.q.splice(k,1)[0].id;
   else{const a2=[...P].filter(x=>!M.has(x));id=a2.length?a2[0]:null}}}
 s.cur=id;save();return id}
function ans(m,w,ok){const s=S[m];s.cur=null;last=w.id;
 s.q=s.q.filter(x=>x.id!==w.id);
 if(ok){if(!s.m.includes(w.id))s.m.push(w.id)}else s.q.push({id:w.id,cd:4});
 save();rec(m,w,ok);
 const f=$('fb');if(f){f.textContent=ok?'Correct!你答對了!':'Try again!再試一次!';f.className=ok?'g':'r'}
 speak(ok?'Correct!':'Try again!',0.9);
 const b=document.querySelector('.bw');if(b)b.outerHTML=bar(m)}

function play(m){if(tab!==m)return;$('fb').textContent='';const id=nextId(m),box=$('qa');
 if(id==null){box.innerHTML='<h3 style="text-align:center">'+(pool(m).length?'🎉 恭喜！這個模式已全數通關！':'這個字母還沒有可出題的內容（克漏字需要在試算表填「例句」）')+'</h3>';return}
 const w=W.find(x=>x.id===id);
 if(m==='choice'){speak(w.w);let ds=shuf(W.filter(x=>x.d!==w.d&&x.w!==w.w));ds=ds.filter(x=>x.p===w.p).concat(ds.filter(x=>x.p!==w.p));
  const seen=new Set([w.d]),o=[{t:w.p+' '+w.d,ok:1}];for(const x of ds){if(o.length>=4)break;if(!seen.has(x.d)){seen.add(x.d);o.push({t:x.p+' '+x.d,ok:0})}}
  mc(m,w,`<div class="qw">${esc(w.w)}</div><div>請選出正確的詞性與中文解釋</div><button class="sp" data-t="${esc(w.w)}" onclick="speak('${esc(w.w).replace(/'/g,"\\'")}')">🔊</button>`,o)}
 else if(m==='cloze'){let ds=shuf(W.filter(x=>x.cz&&x.w.toLowerCase()!==w.w.toLowerCase()&&x.d!==w.d));ds=ds.filter(x=>x.p===w.p).concat(ds.filter(x=>x.p!==w.p));
  const seen=new Set([w.w.toLowerCase()]),o=[{t:w.w,ok:1}];for(const x of ds){if(o.length>=4)break;if(!seen.has(x.w.toLowerCase())){seen.add(x.w.toLowerCase());o.push({t:x.w,ok:0})}}
  mc(m,w,`<div class="qs">${esc(w.cz)}</div><div>請選出填入空格的正確單字</div>`,o)}
 else spellQ(w)}
function mc(m,w,q,opts){$('qa').innerHTML='<div class="qc">'+q+'</div><div class="og"></div>';const g=document.querySelector('#qa .og');
 shuf(opts).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;b._ok=o.ok;
  b.onclick=()=>{[...g.children].forEach(x=>{x.disabled=true;if(x._ok)x.classList.add('ok')});if(!o.ok)b.classList.add('no');ans(m,w,!!o.ok);
   if(m==='cloze'){const full=esc(w.s).replace(new RegExp('(?<![A-Za-z])'+esc(w.w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-z])','gi'),x=>'<b class="hl">'+x+'</b>');
    $('qa').insertAdjacentHTML('beforeend',`<div class="rv"><div class="rs">${full} <button class="sp2" style="width:32px;height:32px;font-size:.9rem" data-t="${esc(w.s)}">🔊</button></div><div class="sc">${esc(w.sc||'')}</div><button class="go" id="nx">下一題 ➡</button></div>`);
    $('nx').onclick=()=>play(m);$('nx').scrollIntoView({block:'nearest',behavior:'smooth'});
    document.querySelector('#qa .sp2').onclick=e=>speak(e.currentTarget.dataset.t)}

let SP=null;
function spellQ(w){const word=w.w,n=word.length;
 const edit=[...word].map((c,i)=>i>0&&/[a-z]/i.test(c));
 SP={w,word,n,edit,L:[...word].map((c,i)=>edit[i]?'':c),st:[],cv:[],sel:edit.indexOf(true),done:false,busy:0,tm:null,ti:null,lock:0,mode:ls.get('vm:sm')||(matchMedia('(pointer:coarse)').matches?'write':'kb')};
 const kb=['abcdefghijklm','nopqrstuvwxyz'].map((r,k)=>'<div class="kr">'+[...r].map(c=>`<button class="kk" data-k="${c}">${c}</button>`).join('')+(k?'<button class="kk wd" data-k="⌫">⌫</button>':'')+'</div>').join('');

 <div class="bxs" id="sbx"></div><div class="ph" id="ph"></div>
 <div class="kbd" id="kbd">${kb}</div>
 <div class="acts"><button class="go2" id="sclr">全部擦掉</button><button class="go2" id="sans">👀 看答案</button><button class="go" id="sb">送出</button></div></div>`;
 $('spb').onclick=()=>speak(word);spTimer(SP);
 document.querySelectorAll('.tg').forEach(b=>b.onclick=()=>{SP.mode=b.dataset.m;ls.set('vm:sm',SP.mode);spView()});
 $('kbd').onclick=e=>{const k=e.target.closest('.kk');if(!k||SP.done||SP.lock)return;if(k.dataset.k==='⌫')spDel();else spPut(k.dataset.k)};
 $('sb').onclick=spSubmit;$('sclr').onclick=spClear;$('sans').onclick=()=>spSubmit(true);
 spBuild();spView()}
function spBuild(){const q=$('sbx');q.innerHTML='';
 [...SP.word].forEach((c,i)=>{const d=document.createElement('div'),ed=SP.edit[i];d.className='wc'+(ed?' ed':' f');d.dataset.i=i;d.style.background=COL[i%6];
  if(ed){d.innerHTML='<div class="wb"><canvas class="wcv"></canvas><div class="bg"></div></div><div class="sl"></div>';SP.cv[i]=d.querySelector('canvas');d.onpointerdown=()=>{if(!SP.done){SP.sel=i;spMark()}}}
  else d.innerHTML=`<div class="wb"><div class="bg" style="display:flex">${esc(c)}</div></div><div class="sl"></div>`;
  q.appendChild(d)});
 SP.edit.forEach((e,i)=>{if(e)spCanvas(i)})}
function spCanvas(i){const cv=SP.cv[i];let ctx=null,st=null,t0=0;
 const size=()=>{const r=cv.getBoundingClientRect();if(!r.width)return false;const d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=6;ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle='#263238';return true};
 const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,Math.round(performance.now()-t0)]};
 cv.style.touchAction='none';
 cv.onpointerdown=e=>{if(SP.done||SP.lock)return;if(!ctx&&!size())return;clearTimeout(SP.tm);SP.sel=i;
  if(SP.L[i]){SP.L[i]='';SP.st[i]=null;ctx.clearRect(0,0,cv.width,cv.height)}
  if(!SP.st[i])t0=performance.now();cv.setPointerCapture(e.pointerId);const p=pt(e);st=[[p[0]],[p[1]],[p[2]]];ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+.1,p[1]+.1);ctx.stroke();spMark()};
 cv.onpointermove=e=>{if(!st)return;const p=pt(e);st[0].push(p[0]);st[1].push(p[1]);st[2].push(p[2]);ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.beginPath();ctx.moveTo(p[0],p[1])};
 const up=()=>{if(!st)return;(SP.st[i]=SP.st[i]||[]).push(st);st=null;clearTimeout(SP.tm);const me=SP;me.tm=setTimeout(()=>spRecog(me,i),300)};
 cv.onpointerup=cv.onpointercancel=up;
 cv.clear=()=>{if(ctx)ctx.clearRect(0,0,cv.width,cv.height)}}
function spMark(){document.querySelectorAll('#sbx .wc').forEach(d=>d.classList.toggle('on',!SP.done&&+d.dataset.i===SP.sel))}
function spNext(from){const n=SP.edit.findIndex((e,i)=>e&&i>from&&!SP.L[i]);if(n>-1)return n;const m=SP.edit.findIndex((e,i)=>e&&!SP.L[i]);return m>-1?m:from}
function spPut(ch){const i=SP.sel;if(i<0||!SP.edit[i])return;SP.L[i]=ch;SP.sel=spNext(i);spView()}
function spDel(){let i=SP.L[SP.sel]?SP.sel:SP.edit.map((e,k)=>e&&SP.L[k]?k:-1).filter(k=>k>=0).pop();if(i===undefined||i<0)return;spWipe(i);SP.sel=i;spView()}
function spWipe(i){SP.L[i]='';SP.st[i]=null;if(SP.cv[i])SP.cv[i].clear()}
function spClear(){if(SP.done)return;clearTimeout(SP.tm);SP.edit.forEach((e,i)=>{if(e)spWipe(i)});SP.sel=SP.edit.indexOf(true);spView()}
function spView(){if(!SP||!$('sbx'))return;
 document.querySelectorAll('#sbx .wc').forEach(d=>{const i=+d.dataset.i,ed=SP.edit[i],ch=SP.L[i];
  d.classList.toggle('bad',SP.done&&ed&&ch.toLowerCase()!==SP.word[i].toLowerCase());
  d.querySelector('.sl').textContent=ed?(ch==='?'?'？':ch):'';
  if(ed)d.querySelector('.bg').textContent=ch==='?'?'':ch});
 $('sbx').classList.toggle('kbm',SP.mode==='kb');
 document.querySelectorAll('.tg').forEach(b=>b.classList.toggle('act',b.dataset.m===SP.mode));
 spMark();
 $('kbd').style.display=SP.done?'none':'';
 $('ph').textContent=SP.busy?'辨識中…':SP.done?'':(SP.mode==='write'?'直接在格子裡寫字母，寫完會立刻辨識並顯示在格子下方；辨識錯了就點格子，再按下面的字母鍵修正。':'點方格，再按字母。寫好按「送出」。');
 $('sb').disabled=SP.done;$('sans').disabled=SP.done}
async function spRecog(me,i){if(SP!==me||me.done||!me.st[i]||!me.st[i].length)return;const strokes=me.st[i],cv=me.cv[i];me.busy++;spView();
 let ch='?';
 try{const ac=new AbortController(),tk=setTimeout(()=>ac.abort(),3000);
  const r=await fetch('https://inputtools.google.com/request?itc=en-t-i0-handwrit&app=vocabulary',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},
   body:JSON.stringify({options:'enable_pre_space',requests:[{writing_guide:{writing_area_width:cv.clientWidth,writing_area_height:cv.clientHeight},ink:strokes,language:'en'}]})});
  clearTimeout(tk);const j=await r.json();const cand=(j[1]&&j[1][0]&&j[1][0][1])||[];
  const hit=cand.map(x=>String(x).trim()[0]).find(x=>x&&/[a-z]/i.test(x));if(hit)ch=hit.toLowerCase()}catch(e){}
 me.busy=Math.max(0,me.busy-1);if(SP!==me||me.done)return;
 me.L[i]=ch;if(me.sel===i||!me.L[me.sel])me.sel=ch==='?'?i:spNext(i);spView()}
function spTimer(me){const T=15000,t0=Date.now();me.ti=setInterval(()=>{if(SP!==me||me.done||tab!=='spell'||!$('spt')){clearInterval(me.ti);return}
 const left=Math.max(0,T-(Date.now()-t0));$('spt').textContent=Math.ceil(left/1000);const b=$('stb');b.style.width=(left/T*100)+'%';b.style.background=left<=5000?'#ef5350':'#4ECDC4';
 if(left<=0){clearInterval(me.ti);me.lock=1;clearTimeout(me.tm);me.edit.forEach((e,i)=>{if(e&&me.st[i]&&me.st[i].length&&!me.L[i])spRecog(me,i)});
  let n=0;const w=setInterval(()=>{if(SP!==me||me.done){clearInterval(w);return}if(me.busy<=0||++n>25){clearInterval(w);spSubmit('t')}},120)}},100)}
function spSubmit(giveUp){if(!SP||SP.done)return;const m=SP;clearInterval(m.ti);
 if(giveUp!==true&&giveUp!=='t'&&m.edit.some((e,i)=>e&&(!m.L[i]||m.L[i]==='?'))){const h=$('ph');h.textContent='還有空格或「？」，請先填好（點格子再用下面的字母鍵修正）';h.style.color='#c62828';setTimeout(()=>{h.style.color=''},2500);return}
 clearTimeout(m.tm);m.done=true;const ok=giveUp!==true&&m.L.join('').toLowerCase()===m.word.toLowerCase();
 spView();if(!ok){$('sbx').insertAdjacentHTML('afterend',`<div class="ans">${giveUp==='t'?'⏰ 時間到！　':''}正確拼法：<b>${esc(m.word)}</b></div>`)}
 ans('spell',m.w,ok);setTimeout(()=>play('spell'),ok?1500:2800)}

 if(/^[a-zA-Z]$/.test(e.key)){spPut(e.key.toLowerCase());e.preventDefault()}else if(e.key==='Backspace'){spDel();e.preventDefault()}else if(e.key==='Enter'){spSubmit();e.preventDefault()}});

 TS.sel=new Set([...TS.sel].filter(c=>cl.includes(c)));
 box.innerHTML=`<h3>字母 ${esc(L)}：作業進度（已答對單字數／總數）</h3>
 <div class="tc"><div>範圍：<select id="tdays" onchange="TS.days=+this.value;vTeacher()">${[[1,'今天'],[7,'近 7 天'],[30,'近 30 天'],[0,'全部']].map(([v,t])=>`<option value="${v}" ${v===TS.days?'selected':''}>${t}</option>`).join('')}</select>
  排序：<select onchange="TS.sort=this.value;tRender()">${[['name','班級／座號'],['t','最近練習'],['acc','正確率 低→高'],['a','作答數 少→多']].map(([v,t])=>`<option value="${v}" ${v===TS.sort?'selected':''}>${t}</option>`).join('')}</select>
  <input id="tq" placeholder="🔍 搜尋姓名／座號／班級" value="${esc(TS.q)}" oninput="TS.q=this.value;tRender(1)">
  <button onclick="vTeacher(1)">🔄 重新整理</button><button onclick="tCsv()">⬇ 匯出 CSV</button></div>
 <div class="tc"><b>班級：</b><span id="tchips"></span></div><div id="tres"></div>`;
 tRender()}
function tChip(c){TS.sel.has(c)?TS.sel.delete(c):TS.sel.add(c);TS.open=null;tRender()}
function tAll(){TS.sel.clear();TS.open=null;tRender()}
function tSave(){ls.set('vm:myCls',[...TS.sel]);alert(TS.sel.size?'已儲存「我的班級」：'+[...TS.sel].join('、')+'\n之後開啟後台會自動只顯示這些班級。':'已清除「我的班級」，之後預設顯示全部班級。');tRender()}
function tView(){const q=TS.q.trim().toLowerCase(),now=Date.now(),by={},wr={};
 TS.recs.forEach(r=>{const c=String(r.cls);if(TS.sel.size&&!TS.sel.has(c))return;
  const key=c+'-'+r.seat+'-'+r.name;if(q&&!(c+' '+r.seat+' '+r.name+' '+key).toLowerCase().includes(q))return;
  const o=by[key]||(by[key]={key,cls:c,seat:r.seat,name:r.name,a:0,c:0,t:0,m:{choice:new Set,cloze:new Set,match:new Set,spell:new Set},ma:{},mc:{},wr:{}});
  o.a++;o.t=Math.max(o.t,r.t);o.ma[r.mode]=(o.ma[r.mode]||0)+1;
  if(r.ok){o.c++;o.mc[r.mode]=(o.mc[r.mode]||0)+1;o.m[r.mode]&&PWS.has(r.wid)&&o.m[r.mode].add(r.wid)}else{const k=r.word+'|'+r.mode;wr[k]=(wr[k]||0)+1;o.wr[k]=(o.wr[k]||0)+1}});
 const list=Object.values(by);
 const F={name:(a,b)=>a.cls.localeCompare(b.cls,'zh',{numeric:true})||(+a.seat-+b.seat)||a.name.localeCompare(b.name,'zh'),t:(a,b)=>a.t-b.t,acc:(a,b)=>acc(a)-acc(b),a:(a,b)=>a.a-b.a}[TS.sort];
 list.sort(TS.sort==='t'?(a,b)=>b.t-a.t:F);return{list,wr}}
let PWS=new Set;const acc=o=>o.c/o.a;
function tRender(keep){PWS=new Set(W.map(x=>x.id));
 const cl=[...new Set(TS.recs.map(r=>String(r.cls)))].sort((a,b)=>a.localeCompare(b,'zh',{numeric:true}));
 $('tchips').innerHTML=`<button class="${TS.sel.size?'':'on'}" onclick="tAll()">全部</button>`+cl.map(c=>`<button class="${TS.sel.has(c)?'on':''}" onclick="tChip('${esc(c).replace(/'/g,'')}')">${esc(c)} 班</button>`).join('')+`<button onclick="tSave()">⭐ 存為我的班級</button>`;
 const{list,wr}=tView(),T={};Object.keys(NM).forEach(m=>T[m]=pool(m).length);const now=Date.now();
 const tot=list.reduce((s,o)=>s+o.a,0),cor=list.reduce((s,o)=>s+o.c,0);
 const rows=list.map(o=>{const idle=now-o.t>7*864e5;return `<tr class="tr ${TS.open===o.key?'sel':''}" onclick="TS.open=TS.open==='${o.key.replace(/['\\]/g,'')}'?null:'${o.key.replace(/['\\]/g,'')}';tRender(1)"><td style="text-align:left">${esc(o.cls)} 班 ${esc(o.seat)} 號 ${esc(o.name)}</td><td>${o.a}</td><td>${Math.round(acc(o)*100)}%</td>${Object.keys(NM).map(m=>`<td>${o.m[m].size}/${T[m]}</td>`).join('')}<td style="${idle?'color:#d32f2f':''}">${idle?'⚠ ':''}${new Date(o.t).toLocaleString('zh-TW',{hour12:false})}</td></tr>`}).join('');
 const top=Object.entries(wr).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([k,v])=>{const[w,m]=k.split('|');return `<tr><td>${esc(w)}</td><td>${NM[m]||m}</td><td>${v}</td></tr>`}).join('');
 let det='';const od=list.find(o=>o.key===TS.open);
 if(od){const dt=Object.entries(od.wr).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>{const[w,m]=k.split('|');return `${esc(w)}（${NM[m]||m}×${v}）`}).join('、')||'無';
  det=`<div class="td"><b>${esc(od.cls)} 班 ${esc(od.seat)} 號 ${esc(od.name)}</b>　`+Object.keys(NM).map(m=>`${NM[m]}：${od.mc[m]||0}/${od.ma[m]||0} 題答對`).join('　')+`<br>常錯單字：${dt}</div>`}
 $('tres').innerHTML=`<p style="margin:6px 0">共 <b>${list.length}</b> 位學生、<b>${tot}</b> 筆作答，平均正確率 <b>${tot?Math.round(cor/tot*100):0}%</b>${TS.sel.size?'（僅顯示：'+[...TS.sel].join('、')+' 班）':''}　<small>點選學生可看詳細；紅字＝超過 7 天未練習</small></p>${det}
 <div style="overflow-x:auto"><table><tr><th>學生</th><th>作答數</th><th>正確率</th>${Object.values(NM).map(n=>`<th>${n}</th>`).join('')}<th>最近練習</th></tr>${rows||'<tr><td colspan=8>沒有符合的資料</td></tr>'}</table></div>
 <h3>常錯單字 Top 15${TS.sel.size?'（所選班級）':''}</h3><table><tr><th>單字</th><th>模式</th><th>答錯次數</th></tr>${top||'<tr><td colspan=3>尚無資料</td></tr>'}</table>`}
function tCsv(){PWS=new Set(W.map(x=>x.id));const{list}=tView(),T={};Object.keys(NM).forEach(m=>T[m]=pool(m).length);
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const h=['班級','座號','姓名','作答數','答對數','正確率%',...Object.values(NM).map(n=>n+'(已掌握)'),'最近練習'];
 const rs=list.map(o=>[o.cls,o.seat,o.name,o.a,o.c,Math.round(o.c/o.a*100),...Object.keys(NM).map(m=>o.m[m].size+'/'+T[m]),new Date(o.t).toLocaleString('zh-TW',{hour12:false})]);
 const csv='\ufeff'+[h,...rs].map(r=>r.map(q).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='作業進度_字母'+L+'.csv';a.click()}

function home(){$('tabs').innerHTML='';sync();
 $('main').innerHTML='<div class="rb"><a class="big" style="background:#FFB3C6" href="?letter=ALL">🎲 全字母隨機挑戰<small>A–Z 全部單字混在一起，練到全部熟練</small></a><a class="big" style="background:#FFE66D" href="?letter='+LETTERS[Math.floor(Math.random()*LETTERS.length)]+'">🎯 隨機抽一個字母<small>不知道練哪個？讓電腦決定</small></a></div><h2 style="text-align:center;font-family:Poppins">或選擇字母</h2><div class="lg">'+LETTERS.map((x,i)=>`<a class="lb" style="background:${COL[i%6]}" href="?letter=${x}">${x}</a>`).join('')+'</div>'}
/* ---------- 啟動 ---------- */
{const opts=LETTERS.includes(LETTER)?LETTERS:[LETTER].concat(LETTERS);
 $('ls').innerHTML=opts.map(x=>`<option ${x===LETTER?'selected':''}>${esc(x)}</option>`).join('');
 $('ls').onchange=e=>{L=e.target.value;page=0;init()};
 $('ls').parentNode.style.display='none';}   // 網址指定字母時，學生不能自行切換
user=ls.get('vm:user',null);if(user)init();else{$('ov').style.display='flex'}
